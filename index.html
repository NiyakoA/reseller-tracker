<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reseller Tracker</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <!-- PapaParse (CSV) + SheetJS (XLSX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- jsPDF + autoTable (PDF export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.0/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    /* ── CSS Variables ───────────────────────────────────────────── */
    :root {
      --sidebar-w: 232px;
      --topbar-h: 0px;
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1);

      /* Dark theme (default) */
      --bg:           #07080e;
      --surface:      #0d0f1a;
      --surface2:     #141828;
      --surface3:     #1a1e30;
      --border:       #1e2235;
      --text:         #e8ecff;
      --text-muted:   #5d6490;

      --accent:       #7c6dfa;
      --accent-dim:   rgba(124, 109, 250, 0.12);
      --accent-hover: #917ff7;
      --accent-grad:  linear-gradient(135deg, #7c6dfa 0%, #a899fc 100%);
      --accent-glow:  rgba(124, 109, 250, 0.25);

      --green:        #10d9a0;
      --red:          #f25c5c;
      --yellow:       #f5a623;

      --shadow-sm:    0 2px 8px rgba(0,0,0,0.35);
      --shadow-md:    0 4px 20px rgba(0,0,0,0.45);
      --shadow-lg:    0 12px 48px rgba(0,0,0,0.6);
      --shadow-xl:    0 24px 80px rgba(0,0,0,0.7);
    }

    [data-theme="light"] {
      --bg:           #f1f3fb;
      --surface:      #ffffff;
      --surface2:     #eaecf8;
      --surface3:     #e0e3f4;
      --border:       #d4d8ee;
      --text:         #151726;
      --text-muted:   #6c7199;

      --accent:       #6c5ffc;
      --accent-dim:   rgba(108, 95, 252, 0.09);
      --accent-hover: #7c70fc;
      --accent-grad:  linear-gradient(135deg, #6c5ffc 0%, #9988fb 100%);
      --accent-glow:  rgba(108, 95, 252, 0.18);

      --green:        #059669;
      --red:          #dc2626;
      --yellow:       #d97706;

      --shadow-sm:    0 2px 8px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 20px rgba(0,0,0,0.09);
      --shadow-lg:    0 12px 48px rgba(0,0,0,0.12);
      --shadow-xl:    0 24px 80px rgba(0,0,0,0.16);
    }

    /* ── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), width var(--transition);
      z-index: 100;
      overflow: hidden;
      position: relative;
    }

    #sidebar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(124,109,250,0.04) 0%, transparent 40%, rgba(0,0,0,0.08) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #sidebar.collapsed {
      width: 56px;
      min-width: 56px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 14px;
      border-bottom: 1px solid var(--border);
      min-height: 64px;
      position: relative;
      z-index: 1;
    }

    .sidebar-logo {
      width: 32px;
      height: 32px;
      background: var(--accent-grad);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .sidebar-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity var(--transition);
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #sidebar.collapsed .sidebar-title { opacity: 0; pointer-events: none; }

    .sidebar-nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      position: relative;
      z-index: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 3px; height: 60%;
      background: var(--accent-grad);
      border-radius: 0 3px 3px 0;
      transition: transform var(--transition);
    }

    .nav-item:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item.active::before {
      transform: translateY(-50%) scaleY(1);
    }

    .nav-item .nav-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      transition: opacity var(--transition);
      font-size: 13.5px;
      font-weight: 500;
    }

    #sidebar.collapsed .nav-label { opacity: 0; }

    .sidebar-footer {
      padding: 10px 8px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      z-index: 1;
    }

    /* ── Main content ────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ──────────────────────────────────────────────────── */
    #topbar {
      height: 58px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    #hamburger {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
    }
    #hamburger:hover { background: var(--surface2); color: var(--text); }

    #page-title {
      font-size: 15px;
      font-weight: 700;
      flex: 1;
      letter-spacing: -0.01em;
    }

    #theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
    }
    #theme-toggle:hover { background: var(--surface2); color: var(--text); }

    /* ── Page container ──────────────────────────────────────────── */
    #pages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .page { display: none; }
    .page.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Empty state placeholder ─────────────────────────────────── */
    .empty-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 12px;
      color: var(--text-muted);
    }
    .empty-page svg { opacity: 0.3; }
    .empty-page h2 { font-size: 18px; color: var(--text); font-weight: 700; }
    .empty-page p { font-size: 13px; }

    /* ── Mobile overlay ──────────────────────────────────────────── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      backdrop-filter: blur(2px);
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn-primary {
      background: var(--accent-grad);
      color: #fff;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      transition: opacity var(--transition), transform 0.12s ease, box-shadow var(--transition);
      box-shadow: 0 2px 8px var(--accent-glow);
      letter-spacing: 0.01em;
    }
    .btn-primary:hover { opacity: 0.9; box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13px;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .btn-ghost { color: var(--text-muted); padding: 7px 12px; border-radius: var(--radius-sm); font-size: 13px; transition: background var(--transition), color var(--transition); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    /* ── Summary bar ─────────────────────────────────────────────── */
    .summary-bar { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden; box-shadow:var(--shadow-sm); }
    .summary-stat { display:flex; flex-direction:column; gap:3px; padding:14px 20px; flex:1; }
    .summary-label { font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    .summary-value { font-size:18px; font-weight:700; letter-spacing:-0.02em; }
    .summary-divider { width:1px; background:var(--border); flex-shrink:0; }

    /* ── Page toolbar ────────────────────────────────────────────── */
    .page-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:8px; }
    .search-input { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 12px; font:inherit; font-size:13px; width:210px; transition:border-color var(--transition), box-shadow var(--transition); }
    .search-input::placeholder { color:var(--text-muted); }
    .search-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .filter-select { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 10px; font:inherit; font-size:13px; transition:border-color var(--transition); }
    .filter-select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .tbl-btn { font-size:14px; padding:2px 4px; border-radius:4px; opacity:.6; transition:opacity var(--transition); cursor:pointer; }
    .tbl-btn:hover { opacity:1; }

    /* ── Modal ───────────────────────────────────────────────────── */
    #modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(3px); }
    #modal-overlay.hidden { display:none; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow-xl); animation:slideUp 0.22s cubic-bezier(0.34,1.3,0.64,1); }
    @keyframes slideUp { from { opacity:0; transform:translateY(24px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
    .modal-header { padding:20px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    #modal-title { font-weight:700; font-size:16px; letter-spacing:-0.01em; }
    .modal-close { width:28px; height:28px; border-radius:var(--radius-sm); color:var(--text-muted); font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; transition:background var(--transition), color var(--transition); }
    .modal-close:hover { background:var(--surface2); color:var(--text); }
    #modal-body { padding:22px; overflow-y:auto; flex:1; }
    .modal-footer { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; }

    /* ── Form ────────────────────────────────────────────────────── */
    .modal-form { display:flex; flex-direction:column; gap:14px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-row.three { grid-template-columns:1fr 1fr 1fr; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-group label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
    .form-group input,
    .form-group select,
    .form-group textarea { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 10px; font:inherit; font-size:13px; width:100%; transition:border-color var(--transition), box-shadow var(--transition); }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .form-group textarea { resize:vertical; }
    .form-group input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.6); }

    /* ── Toast ───────────────────────────────────────────────────── */
    #toast-container { position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 16px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); transform:translateX(20px); opacity:0; transition:opacity .25s ease, transform .25s ease; min-width:200px; }
    .toast.visible { opacity:1; transform:translateX(0); }
    .toast.success { border-left:3px solid var(--green); }
    .toast.error   { border-left:3px solid var(--red); }

    /* ── Tooltips ────────────────────────────────────────────────── */
    [data-tip] {
      position: relative;
      cursor: help;
      text-decoration: underline dotted var(--text-muted);
      text-underline-offset: 3px;
    }
    [data-tip]::before {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.5;
      padding: 8px 12px;
      width: 210px;
      white-space: normal;
      box-shadow: var(--shadow-lg);
      z-index: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
    }
    [data-tip]:hover::before { opacity: 1; }
    [data-tip].tip-right::before { left: 0; transform: none; }
    [data-tip].tip-left::before  { left: auto; right: 0; transform: none; }

    /* ── Simple table ────────────────────────────────────────────── */
    .rt-table { width:100%; border-collapse:collapse; font-size:13px; }
    .rt-table th { background:var(--surface2); border-bottom:1px solid var(--border); padding:9px 12px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); white-space:nowrap; }
    .rt-table th.rt-sortable { cursor:pointer; user-select:none; }
    .rt-table th.rt-sortable:hover { background:var(--surface3); color:var(--text); }
    .rt-table td { padding:10px 12px; border-bottom:1px solid var(--border); }
    .rt-table tbody tr { transition:background var(--transition); }
    .rt-table tbody tr:hover { background:var(--surface2); }
    .rt-table tbody tr:last-child td { border-bottom:none; }
    .rt-empty { text-align:center !important; color:var(--text-muted); padding:40px !important; }
    .rt-pagination { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-top:1px solid var(--border); font-size:12px; color:var(--text-muted); background:var(--surface2); border-radius:0 0 var(--radius) var(--radius); }
    .rt-page-btn { background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:4px 10px; font-size:12px; color:var(--text); cursor:pointer; transition:border-color var(--transition), color var(--transition); }
    .rt-page-btn:hover:not([disabled]) { border-color:var(--accent); color:var(--accent); }
    .rt-page-btn[disabled] { opacity:.4; cursor:not-allowed; }

    /* ── Bulk action bar ─────────────────────────────────────────── */
    .bulk-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .bulk-bar.visible { display: flex; }
    .bulk-bar-count { color: var(--accent); }
    .bulk-bar-actions { display: flex; gap: 6px; margin-left: auto; }

    /* ── Time-range bar ──────────────────────────────────────────── */
    .time-range-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .time-range-pills {
      display: flex;
      gap: 3px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border);
    }
    .range-pill {
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
    }
    .range-pill:hover { background: var(--surface3); color: var(--text); }
    .range-pill.active { background: var(--accent-grad); color: #fff; box-shadow: 0 2px 8px var(--accent-glow); }
    .custom-range-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .custom-range-inputs.hidden { display: none; }
    .custom-range-inputs input[type="date"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 5px 8px;
      font-size: 12px;
    }
    .btn-sm {
      background: var(--accent-grad);
      color: #fff;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    /* ── KPI grid ─────────────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent-grad);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .kpi-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-2px); }
    .kpi-card:hover::before { opacity: 1; }
    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kpi-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: inline-block; }
    .kpi-value { font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
    .kpi-footer { display: flex; align-items: center; gap: 6px; min-height: 18px; }
    .kpi-change {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .kpi-change.up   { background: rgba(16,217,160,.12); color: var(--green); }
    .kpi-change.down { background: rgba(242,92,92,.12);  color: var(--red);  }
    .kpi-change.neutral { color: var(--text-muted); background: none; }
    .kpi-vs { font-size: 10px; color: var(--text-muted); }

    /* ── Dashboard bottom layout ──────────────────────────────────── */
    .dash-bottom {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }
    .dash-bottom-main { display: flex; flex-direction: column; gap: 0; min-width: 0; }
    .dash-bottom-side { display: flex; flex-direction: column; gap: 16px; }

    /* ── Widget cards ────────────────────────────────────────────── */
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .widget-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
      display: block;
      letter-spacing: -0.01em;
    }
    .widget-header .widget-title { margin-bottom: 0; }
    .widget-link { font-size: 12px; color: var(--accent); }
    .widget-link:hover { text-decoration: underline; }

    /* ── Mini table ──────────────────────────────────────────────── */
    .table-scroll { overflow-x: auto; }
    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .mini-table th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 700;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .mini-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .mini-table tbody tr:last-child td { border-bottom: none; }
    .mini-table tbody tr:hover { background: var(--surface2); }
    .mini-table .fw { font-weight: 600; }

    /* ── Bar rows (top products / platform split) ─────────────────── */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .bar-row:last-child { border-bottom: none; }
    .bar-rank {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .bar-info { flex: 1; min-width: 0; }
    .bar-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .bar-sub  { font-size: 11px; color: var(--text-muted); }
    .bar-track {
      flex: 1;
      height: 5px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      min-width: 40px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .5s cubic-bezier(0.4,0,0.2,1);
    }
    .bar-fill.accent { background: var(--accent-grad); }
    .bar-val  { font-size: 12px; font-weight: 700; white-space: nowrap; min-width: 60px; text-align: right; }
    .bar-pct  { font-size: 11px; color: var(--text-muted); min-width: 28px; text-align: right; }
    .plat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Import wizard ───────────────────────────────────────────── */
    #import-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:250; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(3px); }
    #import-overlay.hidden { display:none; }
    .import-modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:780px; max-height:90vh; display:flex; flex-direction:column; box-shadow:var(--shadow-xl); animation:slideUp 0.22s cubic-bezier(0.34,1.3,0.64,1); }
    .import-header { padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .import-header span { font-weight:700; font-size:16px; letter-spacing:-0.01em; }
    .import-close-btn { width:28px; height:28px; border-radius:var(--radius-sm); color:var(--text-muted); font-size:20px; display:flex; align-items:center; justify-content:center; transition:background var(--transition), color var(--transition); }
    .import-close-btn:hover { background:var(--surface2); color:var(--text); }
    .import-progress { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
    .progress-step { flex:1; padding:10px; text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); border-right:1px solid var(--border); text-transform:uppercase; letter-spacing:.05em; transition:color var(--transition), background var(--transition); }
    .progress-step:last-child { border-right:none; }
    .progress-step.active { color:var(--accent); background:var(--accent-dim); }
    .progress-step.done { color:var(--green); }
    #import-body { padding:22px; overflow-y:auto; flex:1; }
    .import-footer { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-shrink:0; }
    .drop-zone { border:2px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; transition:border-color var(--transition),background var(--transition); }
    .drop-zone:hover, .drop-zone.drag-over { border-color:var(--accent); background:var(--accent-dim); }
    .drop-zone p { margin:6px 0; }
    .file-info { margin-top:12px; padding:10px 14px; background:var(--surface2); border-radius:var(--radius-sm); font-size:13px; font-weight:600; }
    .import-info { padding:0 0 14px; font-size:13px; color:var(--text-muted); }
    .mapping-table { display:flex; flex-direction:column; gap:4px; }
    .mapping-header { display:grid; grid-template-columns:190px 1fr 1fr; gap:10px; padding:6px 8px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); margin-bottom:4px; }
    .mapping-row { display:grid; grid-template-columns:190px 1fr 1fr; gap:10px; align-items:center; padding:6px 8px; border-radius:var(--radius-sm); }
    .mapping-row:hover { background:var(--surface2); }
    .mapping-row.required .field-label { font-weight:700; }
    .mapping-row.required .field-label::after { content:' *'; color:var(--red); }
    .col-select { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:5px 8px; font:inherit; font-size:12px; width:100%; }
    .col-select:focus { outline:none; border-color:var(--accent); }
    .preview-val { font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .import-summary-bar { display:flex; align-items:center; gap:10px; padding:0 0 12px; flex-wrap:wrap; }
    .ok-badge   { background:rgba(16,217,160,.12); color:var(--green);  padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .warn-badge { background:rgba(245,166,35,.12);  color:var(--yellow); padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    .preview-table-wrap { overflow:auto; max-height:340px; border:1px solid var(--border); border-radius:var(--radius-sm); }
    .preview-table { width:100%; border-collapse:collapse; font-size:12px; }
    .preview-table th { background:var(--surface2); border-bottom:1px solid var(--border); padding:7px 10px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); white-space:nowrap; position:sticky; top:0; z-index:1; }
    .preview-table td { padding:6px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .preview-table tr.row-warn { background:rgba(245,166,35,.06); }
    .preview-table tr:last-child td { border-bottom:none; }
    .issue-badge { font-size:11px; color:var(--yellow); }
    .ok-tag { color:var(--green); font-weight:700; }
    .import-result { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 20px; text-align:center; gap:12px; }
    .result-icon { font-size:52px; }
    .import-result h3 { font-size:22px; font-weight:700; }
    .import-result p { color:var(--text-muted); font-size:14px; }

    /* ── Settings page ───────────────────────────────────────────── */
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .settings-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); }
    .settings-card h3 { font-size:14px; font-weight:700; margin-bottom:16px; letter-spacing:-0.01em; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .settings-label { font-size:13px; font-weight:600; }
    .settings-sub { font-size:12px; color:var(--text-muted); margin-top:3px; }
    .settings-action-list { display:flex; flex-direction:column; gap:14px; }
    .settings-action-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .theme-seg { display:flex; background:var(--surface2); border-radius:8px; padding:3px; gap:2px; border:1px solid var(--border); }
    .theme-seg-btn { padding:5px 14px; border-radius:6px; font-size:12px; font-weight:600; color:var(--text-muted); transition:all var(--transition); }
    .theme-seg-btn.active { background:var(--accent-grad); color:#fff; box-shadow:0 2px 6px var(--accent-glow); }
    .category-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .category-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:99px; font-size:12px; font-weight:600; transition:border-color var(--transition); }
    .chip-remove { color:var(--text-muted); font-size:16px; line-height:1; cursor:pointer; }
    .chip-remove:hover { color:var(--red); }
    .calc-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
    .calc-input { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:8px 10px; font:inherit; font-size:13px; width:100%; transition:border-color var(--transition), box-shadow var(--transition); }
    .calc-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .calc-result { display:flex; background:var(--surface2); border-radius:8px; border:1px solid var(--border); overflow:hidden; }
    .calc-stat { flex:1; padding:12px 8px; text-align:center; border-right:1px solid var(--border); }
    .calc-stat:last-child { border-right:none; }
    .calc-label { display:block; font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
    .calc-value { font-size:15px; font-weight:700; }
    .danger-zone { border-color:rgba(242,92,92,.2) !important; }
    .btn-danger { background:rgba(242,92,92,.1); color:var(--red); border:1px solid rgba(242,92,92,.25); padding:7px 14px; border-radius:var(--radius-sm); font-weight:600; font-size:13px; white-space:nowrap; transition:background var(--transition); }
    .btn-danger:hover { background:rgba(242,92,92,.2); }
    @media (max-width:900px) { .settings-grid { grid-template-columns:1fr; } .calc-grid { grid-template-columns:1fr 1fr; } }

    /* ── Chart view switcher ─────────────────────────────────────── */
    .chart-view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .chart-view-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .cv-pill {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: all var(--transition);
      cursor: pointer;
    }
    .cv-pill:hover { border-color: var(--accent); color: var(--accent); }
    .cv-pill.active { background: var(--accent-grad); color: #fff; border-color: transparent; box-shadow: 0 2px 6px var(--accent-glow); }

    /* ── Charts ──────────────────────────────────────────────────── */
    .chart-container { position:relative; height:210px; width:100%; }
    .chart-container-tall { position:relative; height:270px; width:100%; }
    .charts-side { display:flex; flex-direction:column; gap:16px; }

    /* ── Inventory-specific ──────────────────────────────────────── */
    .listed-btn { font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid var(--border); color:var(--text-muted); background:var(--surface2); transition:all var(--transition); cursor:pointer; white-space:nowrap; }
    .listed-btn.is-listed { background:rgba(16,217,160,.12); color:var(--green); border-color:var(--green); }
    .listed-btn:hover { border-color:var(--accent); }
    .badge-bd { display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(245,166,35,.15); color:var(--yellow); margin-right:4px; }
    .toggle-label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); cursor:pointer; user-select:none; }
    .toggle-label input[type="checkbox"] { cursor:pointer; }

    /* ── Utility ─────────────────────────────────────────────────── */
    .c-green  { color: var(--green); }
    .c-red    { color: var(--red);   }
    .c-yellow { color: var(--yellow); }
    .empty-msg { padding: 14px 0; color: var(--text-muted); font-size: 13px; }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .dash-bottom { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0; top: 0;
        height: 100vh;
        transform: translateX(-100%);
        width: var(--sidebar-w) !important;
        min-width: var(--sidebar-w) !important;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
      }
      #sidebar.mobile-open ~ #overlay,
      #sidebar.mobile-open + * + #overlay {
        display: block;
      }
      #overlay.visible { display: block; }
      .nav-label { opacity: 1 !important; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Insight strip ───────────────────────────────────────────── */
    .insight-strip { display:flex; gap:12px; }
    .insight-card { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); }
    .insight-card h4 { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
    .insight-val { font-size:20px; font-weight:800; margin-bottom:8px; letter-spacing:-0.02em; }
    .progress-track { height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:99px; background:var(--accent-grad); transition:width .5s ease; }
    .goal-label { font-size:12px; color:var(--text-muted); margin-top:6px; }

    /* ── Performers ──────────────────────────────────────────────── */
    .performers-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .performer-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .performer-row:last-child { border-bottom:none; }
    .perf-badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px; white-space:nowrap; }
    .perf-badge.top { background:rgba(16,217,160,.12); color:var(--green); }
    .perf-badge.bot { background:rgba(242,92,92,.12);  color:var(--red); }

    /* ── App shell ───────────────────────────────────────────────── */
    #app { display: flex; flex: 1; width: 100%; height: 100vh; overflow: hidden; }

    /* ── Auth screen ─────────────────────────────────────────────── */
    .auth-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 8000;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(124,109,250,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(124,109,250,0.05) 0%, transparent 50%);
    }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    .auth-card h1 { font-size: 22px; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.03em; }
    .auth-tagline { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }
    .auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .auth-tab {
      flex: 1; padding: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all var(--transition);
    }
    .auth-tab.is-active {
      background: var(--accent-grad);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-form input {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .auth-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .auth-error {
      color: var(--red);
      font-size: 12px;
      min-height: 16px;
      text-align: center;
    }

    /* ── Loading overlay (shown during DB.init()) ─────────────────── */
    .app-loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 9000;
      color: var(--text-muted); font-size: 14px; font-weight: 500;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="auth-screen" class="auth-screen" style="display:none"></div>

<div id="app" style="display:none">
<!-- ── Sidebar ──────────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <i data-lucide="bar-chart-2" style="width:16px;height:16px;"></i>
    </div>
    <span class="sidebar-title">Reseller</span>
  </div>

  <div class="sidebar-nav">
    <div class="nav-item active" data-page="dashboard">
      <span class="nav-icon"><i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i></span>
      <span class="nav-label">Dashboard</span>
    </div>
    <div class="nav-item" data-page="monthly">
      <span class="nav-icon"><i data-lucide="calendar" style="width:18px;height:18px;"></i></span>
      <span class="nav-label">Monthly Breakdown</span>
    </div>
    <div class="nav-item" data-page="purchases">
      <span class="nav-icon"><i data-lucide="package" style="width:18px;height:18px;"></i></span>
      <span class="nav-label">Purchases</span>
    </div>
    <div class="nav-item" data-page="sales">
      <span class="nav-icon"><i data-lucide="dollar-sign" style="width:18px;height:18px;"></i></span>
      <span class="nav-label">Sales Log</span>
    </div>
    <div class="nav-item" data-page="inventory">
      <span class="nav-icon"><i data-lucide="clipboard-list" style="width:18px;height:18px;"></i></span>
      <span class="nav-label">Inventory</span>

      <span class="nav-icon"><i data-lucide="credit-card" style="width:18px;height:18px;"></i></span>

  <div class="sidebar-footer">
    <div class="nav-item" data-page="settings">

      <span class="nav-label">Settings</span>

</nav>

<!-- Mobile overlay -->
<div id="overlay"></div>

<!-- ── Modal ────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="hidden">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">Modal</span>
      <button class="modal-close" id="modal-close" title="Close">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- ── Toast container ──────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Import Wizard Overlay ────────────────────────────────────── -->
<div id="import-overlay" class="hidden">
  <div class="import-modal">

<script src="js/purchases.js"></script>
<script src="js/sales.js"></script>
<script src="js/inventory.js"></script>
<script src="js/overhead.js"></script>
<script src="js/importer.js"></script>
<script src="js/settings.js"></script>
<script src="js/monthly.js"></script>
<script src="js/pricecheck.js"></script>
<script src="js/app.js"></script>
<script>
  /* ── Page titles ──────────────────────────────────────────────── */
  const PAGE_TITLES = {
    dashboard: 'Dashboard',
    monthly:   'Monthly Breakdown',
    purchases: 'Purchases',
    sales:     'Sales Log',
    inventory: 'Inventory',
    overhead:  'Overhead Expenses',
    settings:  'Settings',
  };

  /* ── DOM refs (declared first so all functions can use them) ───── */
  const sidebar   = document.getElementById('sidebar');
  const overlay   = document.getElementById('overlay');
  const hamburger = document.getElementById('hamburger');
  const html      = document.documentElement;
  const themeIcon = document.getElementById('theme-icon');
  const isMobile  = () => window.innerWidth <= 768;

  /* ── Sidebar helpers ──────────────────────────────────────────── */
  function closeMobileSidebar() {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('visible');
  }

  /* ── Router ───────────────────────────────────────────────────── */
  function getPage() {
    const hash = location.hash.replace('#/', '') || 'dashboard';
    return PAGE_TITLES[hash] ? hash : 'dashboard';
  }

  function navigateTo(page) {
    location.hash = `#/${page}`;
  }

  const PAGE_INITS = {
    dashboard: () => typeof Dashboard !== 'undefined' && Dashboard.init(),
    monthly:   () => typeof Monthly   !== 'undefined' && Monthly.init(),
    purchases: () => typeof Purchases !== 'undefined' && Purchases.init(),
    sales:     () => typeof Sales     !== 'undefined' && Sales.init(),
    inventory: () => typeof Inventory !== 'undefined' && Inventory.init(),
    overhead:  () => typeof Overhead  !== 'undefined' && Overhead.init(),
    settings:  () => typeof Settings  !== 'undefined' && Settings.init(),
  };

  window.applyRoute = function applyRoute() {
    const page = getPage();
    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });
    document.querySelectorAll('.page').forEach(el => {
      el.classList.toggle('active', el.id === `page-${page}`);
    });
    document.getElementById('page-title').textContent = PAGE_TITLES[page];
    closeMobileSidebar();
    PAGE_INITS[page]?.();
  }

  /* ── Theme ────────────────────────────────────────────────────── */
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    themeIcon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
    lucide.createIcons();
    localStorage.setItem('theme', theme);
    document.dispatchEvent(new CustomEvent('themechange', { detail: theme }));
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── Nav click ────────────────────────────────────────────────── */
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.addEventListener('click', () => navigateTo(el.dataset.page));
  });

  /* ── Sidebar toggle ───────────────────────────────────────────── */
  hamburger.addEventListener('click', () => {
    if (isMobile()) {
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('visible', sidebar.classList.contains('mobile-open'));
    } else {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }
  });
  overlay.addEventListener('click', closeMobileSidebar);
  if (!isMobile() && localStorage.getItem('sidebarCollapsed') === 'true') {
    sidebar.classList.add('collapsed');
  }

  /* ── Keyboard shortcuts ───────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMobileSidebar();
  });

  /* ── Boot: theme + icons + systems. Routing now driven by App.start(). ── */
  applyTheme(localStorage.getItem('theme') || 'dark');
  lucide.createIcons();
  Modal.init();
  Importer.init();
  window.addEventListener('hashchange', applyRoute);

</script>
